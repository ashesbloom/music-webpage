<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .spin { transform-origin: 270px 180px; animation: spin 3.7s linear infinite; }
    .strobe { animation: pulse 1.6s ease-in-out infinite; }
    .bar { animation: fill 9s linear infinite; }
    .arm { transform-origin: 478px 58px; animation: drop 9s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    @keyframes fill { from { width: 0; } to { width: 470px; } }
    @keyframes drop { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232323"/><stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="glow" cx="270" cy="180" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f13c3c" stop-opacity="0.32"/><stop offset="1" stop-color="#f13c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="270" cy="180" r="230" fill="url(#glow)"/>

    <!-- platter strobe dots, the record, its label -->
    <circle class="strobe" cx="270" cy="180" r="163" fill="none" stroke="#f13c3c" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 10.6"/>
    <g class="spin">
      <circle cx="270" cy="180" r="152" fill="#0c0c0c"/>
      <g fill="none" stroke="#1d1d1d" stroke-width="1.2">
        <circle cx="270" cy="180" r="144"/><circle cx="270" cy="180" r="136"/><circle cx="270" cy="180" r="128"/>
        <circle cx="270" cy="180" r="118"/><circle cx="270" cy="180" r="110"/><circle cx="270" cy="180" r="100"/>
        <circle cx="270" cy="180" r="92"/><circle cx="270" cy="180" r="82"/><circle cx="270" cy="180" r="74"/>
      </g>
      <circle cx="270" cy="180" r="56" fill="#a21e1e"/>
      <circle cx="270" cy="180" r="48" fill="none" stroke="#f13c3c" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="270" y="166" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#fff">ACRUX</text>
      <text x="270" y="204" text-anchor="middle" font-size="7" letter-spacing="2" fill="#ffd6d6" fill-opacity="0.8">SIDE A · 33⅓</text>
    </g>
    <circle cx="270" cy="180" r="152" fill="url(#sheen)"/>
    <circle cx="270" cy="180" r="4.5" fill="#e6e6e6"/>

    <!-- tonearm -->
    <g class="arm">
      <circle cx="478" cy="58" r="17" fill="#2d2d2d" stroke="#555" stroke-width="2"/>
      <path d="M478 58 L452 196 L402 250" fill="none" stroke="#c9c9c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="386" y="242" width="30" height="16" rx="3" fill="#a21e1e" transform="rotate(-47 401 250)"/>
      <circle cx="478" cy="58" r="6" fill="#f13c3c"/>
    </g>

    <!-- wordmark -->
    <text x="590" y="100" font-size="15" font-weight="700" letter-spacing="4" fill="#f13c3c">VANILLA JS · WEB AUDIO · NO BUILD STEP</text>
    <text x="584" y="196" font-size="104" font-weight="800" letter-spacing="20" fill="#f4f4f4">ACRUX</text>
    <text x="590" y="240" font-size="24" fill="#bdbdbd">A music streamer you play like a turntable.</text>
    <rect x="590" y="272" width="470" height="4" rx="2" fill="#3a3a3a"/>
    <rect class="bar" x="590" y="272" width="0" height="4" rx="2" fill="#f13c3c"/>
    <text x="590" y="304" font-size="14" fill="#8a8a8a">Joji — Glimpse of Us</text>
    <text x="1060" y="304" font-size="14" fill="#8a8a8a" text-anchor="end">3:53</text>
  </g>
</svg>
